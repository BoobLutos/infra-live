name: drift-check

on:
  schedule:
    # 02:17 UTC every day (off the hour to avoid scheduler congestion).
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: drift-check
  cancel-in-progress: false

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Queue plan-only runs and report drift
        run: bash scripts/drift-check.sh
        env:
          TF_API_TOKEN: ${{ secrets.TF_API_TOKEN }}
          TFC_ORG: ${{ vars.TFC_ORG }}
          WORKSPACES: "network-dev app-dev network-prod app-prod"
