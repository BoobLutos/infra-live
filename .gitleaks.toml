# Read by the secret-scan job (gitleaks-action) and by a local `gitleaks git`.
[extend]
useDefault = true

# A Terraform argument whose value is only a variable reference, such as
# `n8n_encryption_key = var.n8n_encryption_key`, holds no secret; the value
# comes from an HCP Terraform variable at run time. generic-api-key flags these
# because the argument name contains "key".
[allowlist]
description = "Terraform variable references"
regexTarget = "line"
regexes = ['''^\s*[A-Za-z0-9_]+\s*=\s*var\.[A-Za-z0-9_]+\s*(#.*)?$''']
